name: CI

on:
    push:
        branches: [main, 'feat/**', 'fix/**']
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            # The tracker has no tests. It starts without a database, so this proves it boots, answers,
            # and keeps unknown paths and the local-only template gallery shut.
            - name: Starts and answers
              env:
                  PORT: '4000'
                  NODE_ENV: production
              run: |
                  node server.js &
                  curl --fail --silent --retry 10 --retry-delay 1 --retry-connrefused --output /dev/null http://localhost:4000/
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:4000/no/such/page)" = 404
                  test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:4000/preview)" = 404

            - run: npm audit --omit=dev --audit-level=high

    # Only a push to main that passed deploys. Vercel's own Git deploys are off in vercel.json.
    deploy:
        needs: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: deploy-vercel
            cancel-in-progress: false
        env:
            VERCEL_ORG_ID: team_cug7jOCNgj5YL7PCFu21b3uP
            VERCEL_PROJECT_ID: prj_MLFLbB89EUvRRWmFjbt98i8qMTXW
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - run: npm install --global vercel@50.1.3

            - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

            - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

            - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

            - name: The tracker answers
              run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null https://stock-flow-tracker-zeta.vercel.app/
