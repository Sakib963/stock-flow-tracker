# Weekly updates, tested by CI like any other push. Minor and patch updates arrive as one grouped pull
# request; a major one arrives on its own, because it can need code changes.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: main
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          npm:
              patterns: ['*']
    - package-ecosystem: github-actions
      directory: /
      target-branch: main
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
